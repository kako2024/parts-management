<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRラベル作成 - 備品管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .label { break-inside: avoid; border-color: #cbd5e1 !important; }
  }
  .label { page-break-inside: avoid; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div class="max-w-3xl mx-auto p-5 space-y-5">

  <header class="no-print">
    <h1 class="text-xl font-bold">QRラベル作成</h1>
    <p class="text-sm text-slate-500 mt-1 leading-relaxed">
      備品IDを 1 行に 1 件ずつ入力すると、貼り付け用の QR ラベルを生成します。
      そのままブラウザの印刷機能（Ctrl/Cmd + P）でシール用紙に印刷してください。
    </p>
  </header>

  <section class="no-print bg-white rounded-2xl p-4 shadow-sm space-y-3">
    <div>
      <label class="block text-sm font-semibold mb-1.5" for="ids">備品ID（1行に1件）</label>
      <textarea id="ids" rows="6" class="w-full p-3 rounded-xl border border-slate-300 font-mono text-sm"
placeholder="ITEM-0001
ITEM-0002
ITEM-0003"></textarea>
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1.5" for="base">
        アプリの URL（任意）
      </label>
      <input id="base" type="url" class="w-full p-3 rounded-xl border border-slate-300 text-sm"
             placeholder="https://ユーザー名.github.io/リポジトリ名/">
      <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
        入力すると QR の中身が <code>URL?item=備品ID</code> になり、カメラアプリで読むだけで
        該当備品のページが開きます。空欄なら QR には備品IDだけを埋め込みます
        （アプリ内スキャナはどちらでも読めます）。
      </p>
    </div>

    <div class="flex items-center gap-3">
      <label class="text-sm font-semibold" for="size">サイズ</label>
      <select id="size" class="p-2 rounded-lg border border-slate-300 text-sm">
        <option value="small">小（40mm・多く貼る用）</option>
        <option value="medium" selected>中（55mm）</option>
        <option value="large">大（75mm・棚札用）</option>
      </select>
      <button id="btn-generate" class="ml-auto h-11 px-6 rounded-xl bg-slate-900 text-white font-semibold">生成</button>
      <button id="btn-print" class="h-11 px-5 rounded-xl bg-white border border-slate-300 font-semibold">印刷</button>
    </div>
  </section>

  <div id="labels" class="grid gap-3" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));"></div>

  <p class="no-print text-xs text-slate-400 text-center pb-8">
    ※ 備品IDはアプリで登録済みのものを使ってください。未登録IDのQRを読むと「新規登録しますか？」と聞かれます。
  </p>
</div>

<script>
(function () {
  'use strict';

  var SIZES = {
    small:  { px: 150, mm: 40, font: 10 },
    medium: { px: 220, mm: 55, font: 12 },
    large:  { px: 300, mm: 75, font: 14 }
  };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function generate() {
    var ids = document.getElementById('ids').value
      .split('\n')
      .map(function (s) { return s.trim(); })
      .filter(Boolean);

    var base = document.getElementById('base').value.trim();
    var size = SIZES[document.getElementById('size').value];
    var box = document.getElementById('labels');
    box.innerHTML = '';
    box.style.gridTemplateColumns = 'repeat(auto-fill, minmax(' + (size.mm * 4) + 'px, 1fr))';

    if (!ids.length) {
      box.innerHTML = '<p class="text-sm text-slate-400 col-span-full text-center py-8">備品IDを入力してください。</p>';
      return;
    }

    if (typeof QRCode === 'undefined') {
      box.innerHTML =
        '<p class="text-sm text-rose-600 col-span-full text-center py-8 leading-relaxed">' +
        'QRコード生成ライブラリを読み込めませんでした。<br>' +
        'ネットワーク接続を確認して、ページを再読み込みしてください。</p>';
      return;
    }

    ids.forEach(function (id) {
      var payload = base
        ? base.replace(/\/?$/, '/').replace(/\/+$/, '/') + '?item=' + encodeURIComponent(id)
        : id;

      var cell = document.createElement('div');
      cell.className = 'label bg-white border border-slate-300 rounded-lg p-2 flex flex-col items-center gap-1';

      var canvas = document.createElement('canvas');
      cell.appendChild(canvas);

      var caption = document.createElement('div');
      caption.className = 'font-mono font-bold text-center leading-tight';
      caption.style.fontSize = size.font + 'px';
      caption.innerHTML = esc(id);
      cell.appendChild(caption);

      box.appendChild(cell);

      QRCode.toCanvas(canvas, payload, {
        width: size.px,
        margin: 1,
        errorCorrectionLevel: 'M',
        color: { dark: '#000000', light: '#ffffff' }
      }, function (err) {
        if (err) {
          cell.innerHTML = '<p class="text-xs text-rose-600">生成失敗: ' + esc(id) + '</p>';
        }
      });
    });
  }

  document.getElementById('btn-generate').addEventListener('click', generate);
  document.getElementById('btn-print').addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>
